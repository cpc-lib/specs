components:
  schemas:
    SendMessageRequest:
      type: object
      required:
      - clientMessageId
      - contentType
      properties:
        clientMessageId:
          type: string
        contentType:
          type: string
          enum:
          - TEXT
          - IMAGE
          - VIDEO
          - FILE
          - PRODUCT_CARD
          - ORDER_CARD
          - AFTERSALE_CARD
          - SYSTEM_EVENT
        content:
          type: string
        contentRef:
          type: object
        attachmentFileIds:
          type: array
          items:
            type: integer
            format: int64
    ApiEnvelope:
      type: object
      required:
      - code
      - message
      - traceId
      properties:
        code:
          type: string
          example: '0'
        message:
          type: string
          example: OK
        data: {}
        traceId:
          type: string
    ErrorEnvelope:
      type: object
      required:
      - code
      - message
      - traceId
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
        traceId:
          type: string
    EmptyCommandRequest:
      type: object
      additionalProperties: false
      description: Explicit empty command body when the command has no business fields.
    CreateCustomerServiceCaseRequest:
      type: object
      required:
      - category
      - description
      properties:
        category:
          type: string
        priority:
          type: string
          enum:
          - LOW
          - NORMAL
          - HIGH
          - URGENT
        relatedType:
          type: string
        relatedId:
          type: string
        description:
          type: string
          maxLength: 4000
    CreateImConversationRequest:
      type: object
      required:
      - shopId
      properties:
        shopId:
          type: integer
          format: int64
        contextType:
          type: string
        contextId:
          type: string
    UpdateNotificationPreferencesRequest:
      type: object
      required:
      - preferences
      properties:
        preferences:
          type: array
          minItems: 1
          items:
            type: object
            required:
            - category
            - channel
            - enabled
            properties:
              category:
                type: string
              channel:
                type: string
              enabled:
                type: boolean
              quietHours:
                type: object
