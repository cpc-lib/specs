openapi: 3.0.3
info:
  title: Fulfillment API
  version: '3.0'
paths:
  /api/seller/v1/orders/{orderNo}/fulfillments:
    post:
      operationId: createFulfillmentPlan
      summary: Create/recalculate fulfillment plan
      parameters:
      - name: orderNo
        in: path
        required: true
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 128
        description: Client command idempotency key. Provider callbacks use provider-native
          unique keys instead.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFulfillmentRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Business Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      x-owner-service: marketplace-fulfillment
      x-command-query: COMMAND
      x-auth-scope: SELLER_MEMBERSHIP_SCOPE
      x-idempotency-required: true
  /api/seller/v1/fulfillments/{fulfillmentNo}/packages:
    post:
      operationId: createFulfillmentPackage
      summary: Create package with exact item quantities
      parameters:
      - name: fulfillmentNo
        in: path
        required: true
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 128
        description: Client command idempotency key. Provider callbacks use provider-native
          unique keys instead.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePackageRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Business Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      x-owner-service: marketplace-fulfillment
      x-command-query: COMMAND
      x-auth-scope: SELLER_MEMBERSHIP_SCOPE
      x-idempotency-required: true
  /api/seller/v1/packages/{packageNo}/ship:
    post:
      operationId: shipPackage
      summary: Hand package to carrier
      parameters:
      - name: packageNo
        in: path
        required: true
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 128
        description: Client command idempotency key. Provider callbacks use provider-native
          unique keys instead.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShipPackageRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Business Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      x-owner-service: marketplace-fulfillment
      x-command-query: COMMAND
      x-auth-scope: SELLER_MEMBERSHIP_SCOPE
      x-idempotency-required: true
  /api/buyer/v1/orders/{orderNo}/receive:
    post:
      operationId: confirmOrderReceive
      summary: Buyer confirm receive
      parameters:
      - name: orderNo
        in: path
        required: true
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 128
        description: Client command idempotency key. Provider callbacks use provider-native
          unique keys instead.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Business Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      x-owner-service: marketplace-fulfillment
      x-command-query: COMMAND
      x-auth-scope: BUYER
      x-idempotency-required: true
  /api/buyer/v1/orders/{orderNo}/packages:
    get:
      operationId: listOrderPackages
      summary: List packages and shipment tracking
      parameters:
      - name: orderNo
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Business Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      x-owner-service: marketplace-fulfillment
      x-command-query: QUERY
      x-auth-scope: BUYER
      x-idempotency-required: false
  /internal/v1/logistics/tracking/{carrierCode}:
    post:
      operationId: handleTrackingCallback
      summary: Carrier tracking webhook
      parameters:
      - name: carrierCode
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrackingCallbackRequest'
      responses:
        '200':
          description: ACK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Business Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      x-owner-service: marketplace-fulfillment
      x-command-query: COMMAND
      x-auth-scope: SERVICE_TO_SERVICE
      x-idempotency-required: false
  /internal/v1/digital-fulfillments:
    post:
      operationId: createDigitalFulfillment
      summary: Create digital fulfillment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDigitalFulfillmentRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Business Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      x-owner-service: marketplace-fulfillment
      x-command-query: COMMAND
      x-auth-scope: SERVICE_TO_SERVICE
      x-idempotency-required: true
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 128
        description: Client command idempotency key. Provider callbacks use provider-native
          unique keys instead.
components:
  schemas:
    ApiError:
      type: object
      required:
      - code
      - message
      - traceId
      properties:
        code:
          type: string
        message:
          type: string
        traceId:
          type: string
    QuantityItem:
      type: object
      required:
      - orderItemId
      - quantity
      properties:
        orderItemId:
          type: integer
          format: int64
        quantity:
          type: integer
          minimum: 1
    CreateFulfillmentRequest:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/QuantityItem'
        preferredWarehouseId:
          type: integer
          format: int64
        clientRequestId:
          type: string
    CreatePackageRequest:
      type: object
      required:
      - items
      - clientPackageRequestId
      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/QuantityItem'
        clientPackageRequestId:
          type: string
    ShipPackageRequest:
      type: object
      required:
      - carrierCode
      - trackingNo
      - shipmentRequestId
      properties:
        carrierCode:
          type: string
        serviceCode:
          type: string
        trackingNo:
          type: string
        shipmentRequestId:
          type: string
    TrackingCallbackRequest:
      type: object
      required:
      - providerEventId
      - trackingNo
      - eventCode
      - eventTime
      properties:
        providerEventId:
          type: string
        trackingNo:
          type: string
        eventCode:
          type: string
        eventTime:
          type: string
          format: date-time
        location:
          type: string
    CreateDigitalFulfillmentRequest:
      type: object
      required:
      - orderItemId
      - fulfillmentType
      properties:
        orderItemId:
          type: integer
          format: int64
        fulfillmentType:
          type: string
          enum:
          - LICENSE_CODE
          - DIGITAL_FILE
          - ACCOUNT_ENTITLEMENT
          - VIRTUAL_TOPUP
          - SERVICE_VOUCHER
        providerCode:
          type: string
        clientRequestId:
          type: string
    ApiEnvelope:
      type: object
      required:
      - code
      - message
      - traceId
      properties:
        code:
          type: string
          example: '0'
        message:
          type: string
          example: OK
        data: {}
        traceId:
          type: string
    ErrorEnvelope:
      type: object
      required:
      - code
      - message
      - traceId
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
        traceId:
          type: string
    EmptyCommandRequest:
      type: object
      additionalProperties: false
      description: Explicit empty command body when the command has no business fields.
