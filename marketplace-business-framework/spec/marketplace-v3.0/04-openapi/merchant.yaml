openapi: 3.0.3
info:
  title: Merchant API
  version: '3.0'
paths:
  /api/platform/v1/merchant-applications/{applicationId}/approve:
    post:
      operationId: approveMerchant
      summary: Approve merchant
      parameters:
      - name: applicationId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 128
        description: Client command idempotency key. Provider callbacks use provider-native
          unique keys instead.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Business Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveMerchantRequest'
      x-owner-service: marketplace-merchant
      x-command-query: COMMAND
      x-auth-scope: PLATFORM_RBAC
      x-idempotency-required: true
  /api/seller/v1/shops:
    post:
      operationId: createShop
      summary: Create shop
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Business Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateShopRequest'
      x-owner-service: marketplace-merchant
      x-command-query: COMMAND
      x-auth-scope: SELLER_MEMBERSHIP_SCOPE
      x-idempotency-required: true
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 128
        description: Client command idempotency key. Provider callbacks use provider-native
          unique keys instead.
  /api/seller/v1/merchant-applications:
    post:
      operationId: createMerchantApplication
      summary: Create enterprise/C2C merchant application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMerchantApplicationRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Business Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      x-owner-service: marketplace-merchant
      x-command-query: COMMAND
      x-auth-scope: SELLER_MEMBERSHIP_SCOPE
      x-idempotency-required: true
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 128
        description: Client command idempotency key. Provider callbacks use provider-native
          unique keys instead.
  /api/seller/v1/merchant-applications/{applicationNo}/submit:
    post:
      operationId: submitMerchantApplication
      summary: Submit merchant application
      parameters:
      - name: applicationNo
        in: path
        required: true
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 128
        description: Client command idempotency key. Provider callbacks use provider-native
          unique keys instead.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Business Conflict
          content:
            application/json:
              schema:
