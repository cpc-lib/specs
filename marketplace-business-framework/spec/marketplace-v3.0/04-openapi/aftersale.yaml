      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReceiveReturnRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Business Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      x-owner-service: marketplace-aftersale
      x-command-query: COMMAND
      x-auth-scope: SELLER_MEMBERSHIP_SCOPE
      x-idempotency-required: true
  /api/seller/v1/returns/{returnNo}/inspect:
    post:
      operationId: inspectReturn
      summary: Inspect returned goods
      parameters:
      - name: returnNo
        in: path
        required: true
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 128
        description: Client command idempotency key. Provider callbacks use provider-native
          unique keys instead.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InspectReturnRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Business Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      x-owner-service: marketplace-aftersale
      x-command-query: COMMAND
      x-auth-scope: SELLER_MEMBERSHIP_SCOPE
      x-idempotency-required: true
  /api/seller/v1/after-sales/{afterSaleNo}/exchange:
    post:
      operationId: createExchangeOrder
      summary: Create exchange execution
      parameters:
      - name: afterSaleNo
        in: path
        required: true
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 128
        description: Client command idempotency key. Provider callbacks use provider-native
          unique keys instead.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExchangeRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Business Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      x-owner-service: marketplace-aftersale
      x-command-query: COMMAND
      x-auth-scope: SELLER_MEMBERSHIP_SCOPE
      x-idempotency-required: true
  /api/seller/v1/after-sales/{afterSaleNo}/repair:
    post:
      operationId: createRepairOrder
      summary: Create repair execution
      parameters:
      - name: afterSaleNo
        in: path
        required: true
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 128
        description: Client command idempotency key. Provider callbacks use provider-native
          unique keys instead.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Business Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRepairOrderRequest'
      x-owner-service: marketplace-aftersale
      x-command-query: COMMAND
      x-auth-scope: SELLER_MEMBERSHIP_SCOPE
      x-idempotency-required: true
components:
  schemas:
    ApiError:
      type: object
      required:
      - code
      - message
      - traceId
      properties:
        code:
          type: string
        message:
          type: string
        traceId:
          type: string
    Money:
      type: object
      required:
      - currency
      - amount
      properties:
        currency:
          type: string
          minLength: 3
          maxLength: 3
        amount:
          type: string
          pattern: ^-?\d+(\.\d{1,2})?$
    CreateAfterSaleRequest:
      type: object
      required:
      - orderNo
      - orderItemId
      - type
      - quantity
      - reasonCode
      properties:
        orderNo:
          type: string
        orderItemId:
          type: integer
          format: int64
        type:
          type: string
        quantity:
          type: integer
          minimum: 1
        requestedAmount:
          type: string
        reasonCode:
          type: string
        reasonText:
          type: string
    ApproveAfterSaleRequest:
      type: object
      required:
      - approvedAmount
      properties:
        approvedAmount:
          type: string
        returnAddressId:
          type: integer
          format: int64
        remark:
          type: string
    DecideDisputeRequest:
      type: object
      required:
      - decisionType
      - reason
      properties:
        decisionType:
          type: string
        decisionAmount:
          type: string
        reason:
          type: string
    SubmitReturnShipmentRequest:
      type: object
      required:
      - pickupMode
      properties:
        pickupMode:
          type: string
          enum:
          - BUYER_SHIP
          - COURIER_PICKUP
          - MERCHANT_PICKUP
        carrierCode:
          type: string
        trackingNo:
          type: string
    ReceiveReturnRequest:
      type: object
      required:
      - receivedQty
      properties:
        receivedQty:
          type: integer
          minimum: 1
        remark:
          type: string
    InspectReturnRequest:
      type: object
      required:
      - inspectedQty
      - acceptedQty
      - rejectedQty
      - resultCode
      properties:
        inspectedQty:
          type: integer
          minimum: 1
        acceptedQty:
          type: integer
          minimum: 0
        rejectedQty:
          type: integer
          minimum: 0
        resultCode:
          type: string
        detail:
          type: object
    CreateExchangeRequest:
      type: object
      required:
      - replacementSkuId
      - quantity
      properties:
        replacementSkuId:
          type: integer
          format: int64
        quantity:
          type: integer
          minimum: 1
    ApiEnvelope:
      type: object
      required:
      - code
      - message
      - traceId
      properties:
        code:
          type: string
          example: '0'
        message:
          type: string
          example: OK
        data: {}
        traceId:
          type: string
    ErrorEnvelope:
      type: object
      required:
      - code
      - message
      - traceId
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
        traceId:
          type: string
    EmptyCommandRequest:
      type: object
      additionalProperties: false
      description: Explicit empty command body when the command has no business fields.
    CreateRepairOrderRequest:
      type: object
      properties:
        serviceProviderId:
          type: integer
          format: int64
        clientRequestId:
          type: string
