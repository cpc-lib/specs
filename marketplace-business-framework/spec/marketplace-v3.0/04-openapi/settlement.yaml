openapi: 3.0.3
info:
  title: Settlement API
  version: '3.0'
paths:
  /api/seller/v1/settlements:
    get:
      operationId: listSettlements
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettlementListResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Business Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      x-owner-service: marketplace-settlement
      x-command-query: QUERY
      x-auth-scope: SELLER_MEMBERSHIP_SCOPE
      x-idempotency-required: false
  /api/seller/v1/settlements/{settlementNo}:
    get:
      operationId: getSettlement
      parameters:
      - name: settlementNo
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettlementDetailResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Business Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      x-owner-service: marketplace-settlement
      x-command-query: QUERY
      x-auth-scope: SELLER_MEMBERSHIP_SCOPE
      x-idempotency-required: false
  /api/platform/v1/settlements/{settlementNo}/approve:
    post:
      operationId: approveSettlement
      parameters:
      - name: settlementNo
        in: path
        required: true
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 128
        description: Client command idempotency key. Provider callbacks use provider-native
          unique keys instead.
      responses:
        '200':
          description: Approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Business Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      x-owner-service: marketplace-settlement
      x-command-query: COMMAND
      x-auth-scope: PLATFORM_RBAC
      x-idempotency-required: true
  /api/platform/v1/settlements/{settlementNo}/payout:
    post:
      operationId: createSettlementPayout
      parameters:
      - name: settlementNo
        in: path
        required: true
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayoutResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Business Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      x-owner-service: marketplace-settlement
      x-command-query: COMMAND
      x-auth-scope: PLATFORM_RBAC
      x-idempotency-required: true
  /api/seller/v1/payables:
    get:
      operationId: listMerchantPayables
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Business Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      x-owner-service: marketplace-settlement
      x-command-query: QUERY
      x-auth-scope: SELLER_MEMBERSHIP_SCOPE
      x-idempotency-required: false
  /api/seller/v1/payouts/{payoutNo}:
    get:
      operationId: getMerchantPayout
      parameters:
      - name: payoutNo
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Business Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      x-owner-service: marketplace-settlement
      x-command-query: QUERY
      x-auth-scope: SELLER_MEMBERSHIP_SCOPE
      x-idempotency-required: false
  /api/seller/v1/withdrawals:
    post:
      operationId: createMerchantWithdrawal
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWithdrawalRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Business Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      x-owner-service: marketplace-settlement
      x-command-query: COMMAND
      x-auth-scope: SELLER_MEMBERSHIP_SCOPE
      x-idempotency-required: true
components:
  schemas:
    ApiError:
      type: object
      required:
      - code
      - message
      - traceId
      properties:
        code:
          type: string
        message:
          type: string
        traceId:
          type: string
    Money:
      type: object
      required:
      - currency
      - amount
      properties:
        currency:
          type: string
          minLength: 3
          maxLength: 3
        amount:
          type: string
          pattern: ^-?\d+(\.\d{1,2})?$
    SettlementListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
        nextCursor:
          type: string
    SettlementDetailResponse:
      type: object
      properties:
        settlementNo:
          type: string
        merchantId:
          type: integer
          format: int64
        status:
          type: string
        grossAmount:
          type: string
        commissionAmount:
          type: string
        feeAmount:
          type: string
        adjustmentAmount:
          type: string
        payableAmount:
          type: string
        items:
          type: array
          items:
            type: object
    PayoutResponse:
      type: object
      properties:
        payoutNo:
          type: string
        status:
          type: string
        amount:
          type: string
    CreateWithdrawalRequest:
      type: object
      required:
      - amount
      - currency
      properties:
        amount:
          type: string
        currency:
          type: string
        providerAccountRef:
          type: string
    ApiEnvelope:
      type: object
      required:
      - code
      - message
      - traceId
      properties:
        code:
          type: string
          example: '0'
        message:
          type: string
          example: OK
        data: {}
        traceId:
          type: string
    ErrorEnvelope:
      type: object
      required:
      - code
      - message
      - traceId
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
        traceId:
          type: string
    EmptyCommandRequest:
      type: object
      additionalProperties: false
      description: Explicit empty command body when the command has no business fields.
