server:
  port: 8081
spring:
  application:
    name: charging-system
  config:
    import: optional:nacos:${spring.application.name}.yml?server-addr=${NACOS_SERVER_ADDR:127.0.0.1:8848}
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/ev_charging_platform?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root123456}
  flyway:
    enabled: true
    table: flyway_system_schema_history
    locations: classpath:db/migration
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      config:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
charging:
  security:
    dev-tenant-header-enabled: ${DEV_TENANT_HEADER_ENABLED:false}
    access-token-secret: ${ACCESS_TOKEN_SECRET:dev-access-token-secret-change-me-1234567890}
    access-token-minutes: ${ACCESS_TOKEN_MINUTES:15}
    refresh-token-days: ${REFRESH_TOKEN_DAYS:30}
    internal-service-key: ${INTERNAL_SERVICE_KEY:dev-internal-service-key-change-me}
    bootstrap-demo-users: ${BOOTSTRAP_DEMO_USERS:false}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics

# SPEC 8.3 resilience / observability
spring.cloud.sentinel.enabled: true
spring.cloud.sentinel.eager: true
spring.cloud.sentinel.transport.dashboard: ${SENTINEL_DASHBOARD:}
feign.sentinel.enabled: true
management.metrics.tags.application: ${spring.application.name}
management.prometheus.metrics.export.enabled: true
charging.performance.spec83: true

## SPEC 8.3 bounded runtime defaults
spring.datasource.hikari.minimum-idle: ${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.maximum-pool-size: ${DB_POOL_MAX:30}
spring.datasource.hikari.connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:3000}
spring.datasource.hikari.validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:1000}
spring.datasource.hikari.idle-timeout: ${DB_IDLE_TIMEOUT_MS:600000}
spring.datasource.hikari.max-lifetime: ${DB_MAX_LIFETIME_MS:1800000}
charging.executor.io.core-size: ${IO_EXECUTOR_CORE:8}
charging.executor.io.max-size: ${IO_EXECUTOR_MAX:32}
charging.executor.io.queue-capacity: ${IO_EXECUTOR_QUEUE:500}
charging.executor.business.core-size: ${BUSINESS_EXECUTOR_CORE:8}
charging.executor.business.max-size: ${BUSINESS_EXECUTOR_MAX:24}
charging.executor.business.queue-capacity: ${BUSINESS_EXECUTOR_QUEUE:1000}

management.endpoint.health.probes.enabled: true
management.metrics.distribution.percentiles-histogram.http.server.requests: true
management.metrics.distribution.slo.http.server.requests: 100ms,300ms,800ms,2s
server.tomcat.threads.max: ${TOMCAT_MAX_THREADS:200}
server.tomcat.threads.min-spare: ${TOMCAT_MIN_SPARE_THREADS:20}
server.tomcat.accept-count: ${TOMCAT_ACCEPT_COUNT:200}
server.tomcat.connection-timeout: ${HTTP_CONNECTION_TIMEOUT:5s}
