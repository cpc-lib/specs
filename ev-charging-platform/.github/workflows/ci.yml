name: ci
on:
  push:
  pull_request:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - run: python scripts/validate_static.py
      - name: Validate compose model
        run: docker compose -f deploy/docker/docker-compose.yml config >/dev/null

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Maven verify
        run: ./mvnw -B -ntp clean verify

  frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [admin-web, merchant-web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        working-directory: ${{ matrix.app }}
        run: npm install
      - name: Build
        working-directory: ${{ matrix.app }}
        run: npm run build

  simulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: mkdir -p build/simulator && javac --release 21 -d build/simulator device-simulator/src/main/java/com/example/evcharging/simulator/DeviceSimulator.java
